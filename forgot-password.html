<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LittleStars School</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-surface-alt); padding: 2rem; position: relative; overflow: hidden; }
        .auth-container::before { content: ''; position: absolute; width: 500px; height: 500px; background: var(--primary); border-radius: 50%; opacity: 0.05; top: -200px; left: -200px; filter: blur(60px); pointer-events: none; }
        .auth-container::after { content: ''; position: absolute; width: 400px; height: 400px; background: var(--secondary); border-radius: 50%; opacity: 0.05; bottom: -100px; right: -100px; filter: blur(60px); pointer-events: none; }
        
        .auth-card { max-width: 450px; width: 100%; background: var(--bg-surface); padding: 3.5rem 3rem; border-radius: 2rem; box-shadow: var(--shadow-xl); border: 1px solid var(--border-color); position: relative; z-index: 1; text-align: center; }
        .auth-icon { width: 80px; height: 80px; background: rgba(var(--primary-dark), 0.1); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 2rem; }
        
        .form-group { margin-bottom: 2rem; position: relative; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-main); }
        .form-group input { width: 100%; padding: 1rem 1rem 1rem 3rem; border: 1px solid var(--border-color); border-radius: 0.75rem; background: var(--bg-main); color: var(--text-main); transition: var(--transition-fast); }
        .form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(var(--primary-dark), 0.1); }
        .form-group i { position: absolute; left: 1rem; top: 2.5rem; color: var(--text-muted); }
        [dir="rtl"] .form-group input { padding: 1rem 3rem 1rem 1rem; }
        [dir="rtl"] .form-group i { left: auto; right: 1rem; }
        [dir="rtl"] .form-group { text-align: right; }

        .auth-tools { position: absolute; top: 2rem; right: 2rem; display: flex; gap: 1rem; z-index: 10; }
        [dir="rtl"] .auth-tools { right: auto; left: 2rem; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Floating Tools (Theme & RTL) -->
        <div class="auth-tools">
            <button id="rtlToggle" class="tool-btn lang-toggle" aria-label="Toggle Layout Direction">LTR</button>
            <button id="themeToggle" class="tool-btn" aria-label="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="auth-card reveal">
            <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
            <h2 class="text-3xl mb-2">Forgot Password?</h2>
            <p class="text-muted mb-4">No worries, we'll send you reset instructions.</p>

            <form action="login.html" method="GET">
                <div class="form-group">
                    <label>Email Address</label>
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Enter your registered email" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-bottom: 1.5rem;">Reset Password</button>
            </form>
            
            <a href="login.html" class="text-muted font-bold"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
